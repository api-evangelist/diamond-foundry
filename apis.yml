name: Diamond Foundry
description: 'Diamond Foundry is a deep-tech materials company that manufactures semiconductor-grade
  single-crystal diamond wafers and diamond transistors to overcome the thermal limits of silicon in
  AI chips, datacenters, and electric vehicles. The company operates its own foundries and has built a
  full technology stack for producing diamond at scale as a sustainable substrate for high-performance
  and power electronics. It is tracked in the API Evangelist network as a planetary-health portfolio
  company of Obvious Ventures; it publishes no public developer API or documentation at this time.'
